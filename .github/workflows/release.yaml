name: Publish dev container features and templates

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  DEVCONTAINER_CLI_VERSION: "0.89.0"
  FEATURES_NAMESPACE: nmwael/agentic-devcontainer-feature
  TEMPLATES_NAMESPACE: nmwael/agentic-devcontainer-feature-templates

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install devcontainer CLI
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Publish features
        run: |
          for feature in llama-server gpu-bridge bifrost-gateway models opencode-agents; do
            echo "Publishing ${feature}..."
            devcontainer features publish "./${feature}" -r ghcr.io -n "${FEATURES_NAMESPACE}" --log-level info
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish llm-lab template
        run: devcontainer templates publish ./llm-lab -r ghcr.io -n "${TEMPLATES_NAMESPACE}" --log-level info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
