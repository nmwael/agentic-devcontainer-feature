name: Publish dev container features and templates

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  DEVCONTAINER_CLI_VERSION: "0.89.0"
  FEATURES_NAMESPACE: nmwael/agentic-devcontainer-feature
  TEMPLATES_NAMESPACE: nmwael/agentic-devcontainer-feature-templates

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install devcontainer CLI
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Publish features
        run: devcontainer features publish ./src -r ghcr.io -n "${FEATURES_NAMESPACE}" --log-level info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish llm-lab template
        run: devcontainer templates publish ./src/templates -r ghcr.io -n "${TEMPLATES_NAMESPACE}" --log-level info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate devcontainer lock file
        run: |
          # Regenerate lock file to pin newly published feature/template digests
          devcontainer build --workspace-folder . --log-level info || true
          # Optional: commit lock file changes back to repo (requires write permission)
          # git config user.name "github-actions"
          # git config user.email "github-actions@github.com"
          # git add .devcontainer/devcontainer-lock.json
          # git diff --quiet && git diff --staged --quiet || git commit -m "chore: update devcontainer lock file"
          # git push

      - name: Smoke-test published llm-lab template
        run: |
          set -euo pipefail
          TPL_VERSION="$(jq -r .version src/templates/llm-lab/devcontainer-template.json)"
          SMOKE="$(mktemp -d)"
          echo "Applying llm-lab template v${TPL_VERSION} into $SMOKE"
          devcontainer templates apply -w "$SMOKE" \
            --template-id "ghcr.io/${TEMPLATES_NAMESPACE}/llm-lab:${TPL_VERSION}" \
            --log-level info
          echo "Building the generated dev container (validates templateOption rendering + feature resolution)"
          devcontainer build --workspace-folder "$SMOKE" --log-level info
